spring.application.name=backend

# Google OAuth2 beállítások
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

# Admin e-mail whitelist
blog.admin.emails=fabian.denes23@gmail.com,nagyannna2002@gmail.com,drpbence@gmail.com

# ====================================================
# POSTGRESQL ADATBÁZIS BEÁLLÍTÁSOK
# ====================================================
# Írd át a portot (alapértelmezetten 5432), az adatbázis nevét, a usert és a jelszót!
spring.datasource.url=jdbc:postgresql://localhost:5432/blogdb   
spring.datasource.username=postgres
spring.datasource.password=MonsterNitro12
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate beállítások (automatikusan felépíti a táblákat a Java Entity-kből)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ====================================================
# JWT BEÁLLÍTÁSOK
# ====================================================
# Egy legalább 256 bites (min. 32 karakteres) titkos kulcs a tokenek aláírásához
jwt.secret=SlittySlattySluttyUltraSecureBlogJwtSecretKey2026_ChangeMe!
# Access Token élettartam: 15 perc (miliszekundumban: 15 * 60 * 1000)
jwt.access-token-expiration=900000
# Refresh Token élettartam: 7 nap (miliszekundumban: 7 * 24 * 60 * 60 * 1000)
jwt.refresh-token-expiration=604800000